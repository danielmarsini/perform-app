<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale=1 + user-scalable=no: app pensata per essere usata come
         un'app nativa (stile Instagram/WhatsApp), niente pinch-zoom o zoom
         automatico iOS quando si tocca un campo di testo. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Perform</title>

    <!-- Icona/logo dell'app: stessa icona (pulse dorato su nero) del logo
         nell'header, per "Aggiungi a Home" e come favicon. Vedi
         public/favicon.svg per il sorgente vettoriale — i PNG sono generati
         da lì (resvg-cli) per i punti in cui iOS/i manifest PWA vogliono un
         raster e non accettano SVG. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#09090B" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Perform" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Overlay "ruota il telefono": fallback per gli schermi/browser dove
         manifest.json orientation:portrait-primary non basta da solo (iOS
         Safari lo ignora del tutto). Nascosto via CSS in src/index.css,
         mostrato solo in @media (orientation: landscape) su dispositivi
         touch — mai su desktop, dove il landscape è normale. -->
    <div id="orientation-lock-overlay" aria-hidden="true">
      <div class="orientation-lock-content">
        <div class="orientation-lock-icon">📱</div>
        <p>Ruota il telefono in verticale<br />per usare Perform</p>
      </div>
    </div>
    <script>
      // Tentativo best-effort di lock nativo (funziona solo in PWA
      // standalone su alcuni browser Android) — fallisce silenziosamente
      // ovunque non sia supportato, il fallback CSS resta la vera rete di
      // sicurezza.
      try {
        if (window.matchMedia("(display-mode: standalone)").matches && screen.orientation && screen.orientation.lock) {
          screen.orientation.lock("portrait").catch(() => {});
        }
      } catch {}
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
