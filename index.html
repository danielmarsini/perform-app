<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale=1 + user-scalable=no: app pensata per essere usata come
         un'app nativa (stile Instagram/WhatsApp), niente pinch-zoom o zoom
         automatico iOS quando si tocca un campo di testo. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Perform</title>

    <!-- Icona/logo dell'app: stessa icona (pulse dorato su nero) del logo
         nell'header, per "Aggiungi a Home" e come favicon. Vedi
         public/favicon.svg per il sorgente vettoriale — i PNG sono generati
         da lì (resvg-cli) per i punti in cui iOS/i manifest PWA vogliono un
         raster e non accettano SVG. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#09090B" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Perform" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Blocco orientamento verticale, stile Instagram/WhatsApp.
      //
      // 1) screen.orientation.lock("portrait") — blocco VERO e invisibile a
      //    livello di sistema operativo, ma disponibile solo in PWA
      //    installata (standalone) su Android/Chrome. iOS non lo offre mai
      //    a nessuna web app, nemmeno installata (limite del sistema
      //    operativo Apple — un'app nativa vera dell'App Store sarebbe
      //    l'unico modo per un blocco altrettanto perfetto su iPhone;
      //    valutazione rimandata a un secondo momento).
      // 2) Rete di sicurezza CSS (src/index.css) ovunque il lock nativo non
      //    ci sia o non basti: contro-ruota il contenuto quando il telefono
      //    fisico gira, così resta visibilmente verticale. Comporta un
      //    breve scatto visivo (il browser mostra per una frazione di
      //    secondo il layout orizzontale prima che il CSS intervenga) —
      //    accettato come compromesso per ora, priorità su altri bug.
      try {
        if (window.matchMedia("(display-mode: standalone)").matches && screen.orientation && screen.orientation.lock) {
          screen.orientation.lock("portrait").catch(() => {});
        }
      } catch {}

      function updatePortraitLockDir() {
        try {
          const angle = (screen.orientation && screen.orientation.angle) ?? window.orientation ?? 0;
          const dir = (angle === 270 || angle === -90) ? "b" : "a";
          document.documentElement.setAttribute("data-portrait-lock-dir", dir);
        } catch {}
      }
      updatePortraitLockDir();
      window.addEventListener("orientationchange", updatePortraitLockDir);
      try { screen.orientation && screen.orientation.addEventListener("change", updatePortraitLockDir); } catch {}
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
