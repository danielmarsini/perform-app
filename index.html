<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale=1 + user-scalable=no: app pensata per essere usata come
         un'app nativa (stile Instagram/WhatsApp), niente pinch-zoom o zoom
         automatico iOS quando si tocca un campo di testo. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Perform</title>

    <!-- Icona/logo dell'app: stessa icona (pulse dorato su nero) del logo
         nell'header, per "Aggiungi a Home" e come favicon. Vedi
         public/favicon.svg per il sorgente vettoriale — i PNG sono generati
         da lì (resvg-cli) per i punti in cui iOS/i manifest PWA vogliono un
         raster e non accettano SVG. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#09090B" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Perform" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Blocco orientamento verticale, stile Instagram/WhatsApp — SOLO il
      // lock nativo del sistema operativo, mai un trucco CSS che ruota il
      // contenuto "a mano": qualunque contro-rotazione via transform
      // produce comunque un movimento visibile (il browser rifà comunque
      // il layout in orizzontale per una frazione di secondo prima che il
      // CSS intervenga, e la stessa animazione di rotazione fisica del
      // telefono resta visibile sotto la contro-rotazione) — richiesta
      // esplicita: la pagina non deve mai muoversi, né reagire in alcun
      // modo al giro del telefono.
      //
      // screen.orientation.lock("portrait") impedisce DAVVERO la rotazione
      // a livello di sistema operativo — zero movimento, zero reflow,
      // proprio come un'app nativa — ma è supportato SOLO in PWA
      // installata (standalone) su Android/Chrome; iOS Safari non lo offre
      // mai, in nessuna modalità. Per chi ha installato l'app ("Aggiungi a
      // Home", il modo in cui l'app è pensata per essere usata) il blocco è
      // reale e invisibile. In una scheda di un browser normale — dove
      // nessun sito, incluso Instagram o WhatsApp via browser, può bloccare
      // davvero la rotazione — l'app si comporta come qualunque pagina web
      // responsive, senza nessun trucco che la faccia scattare.
      try {
        if (window.matchMedia("(display-mode: standalone)").matches && screen.orientation && screen.orientation.lock) {
          screen.orientation.lock("portrait").catch(() => {});
        }
      } catch {}
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
